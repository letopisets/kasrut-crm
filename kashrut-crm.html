      {modal==="insp"&&(<Mdl title={t.inspections.addTitle} onClose={()=>setModal(null)}><Inp label={t.inspections.restaurant} value={iF.restaurantId} onChange={v=>setIF(p=>({...p,restaurantId:v}))} options={restaurants.map(r=>({value:r.id,label:r.name}))}/><Inp label={t.inspections.date} value={iF.date} onChange={v=>setIF(p=>({...p,date:v}))} type="date"/><Inp label={t.inspections.type} value={iF.type} onChange={v=>setIF(p=>({...p,type:v}))} options={["planned","urgent"]}/><Inp label={t.inspections.assign} value={iF.mashgiachId} onChange={v=>setIF(p=>({...p,mashgiachId:v}))} options={mashgichim.filter(m=>m.active).map(m=>({value:m.id,label:m.name}))}/><Inp label={t.inspections.notes} value={iF.notes} onChange={v=>setIF(p=>({...p,notes:v}))} placeholder="..."/><div style={{display:"flex",gap:7,marginTop:4}}><Btn onClick={saveI}>{t.inspections.save}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.inspections.cancel}</Btn></div></Mdl>)}

      {modal==="mash"&&(<Mdl title={t.mashgichim.addTitle} onClose={()=>setModal(null)}><Inp label={t.mashgichim.name} value={mF.name} onChange={v=>setMF(p=>({...p,name:v}))}/><Inp label={t.mashgichim.phone} value={mF.phone} onChange={v=>setMF(p=>({...p,phone:v}))}/><Inp label={t.mashgichim.email} value={mF.email} onChange={v=>setMF(p=>({...p,email:v}))} type="email"/><Inp label={t.mashgichim.area} value={mF.area} onChange={v=>setMF(p=>({...p,area:v}))}/><div style={{marginBottom:12}}><label style={{fontSize:10,color:"#666",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.5px"}}>{t.mashgichim.hechsherim}</label><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{hechsherim.map(h=>{const sel=mF.hechsherimIds.includes(h.id);return <button key={h.id} onClick={()=>toggleMH(h.id)} style={{background:sel?`${h.color}22`:"#22253A",border:sel?`1px solid ${h.color}55`:"1px solid #2A2D3E",color:sel?h.color:"#666",padding:"4px 10px",borderRadius:20,cursor:"pointer",fontSize:11,fontWeight:sel?700:400}}>{h.shortName}</button>;})}</div></div><div style={{display:"flex",gap:7,marginTop:4}}><Btn onClick={saveM}>{t.mashgichim.save}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.mashgichim.cancel}</Btn></div></Mdl>)}

      {modal==="hech"&&(<Mdl title={t.hechsherim.addTitle} onClose={()=>setModal(null)}><Inp label={t.hechsherim.name} value={hF.name} onChange={v=>setHF(p=>({...p,name:v}))}/><Inp label={t.hechsherim.shortName} value={hF.shortName} onChange={v=>setHF(p=>({...p,shortName:v}))}/><Inp label={t.hechsherim.city} value={hF.city} onChange={v=>setHF(p=>({...p,city:v}))} options={["Jerusalem","Haifa","Tel Aviv","Tzfat","Tiberias","Bnei Brak"]}/><Inp label={t.hechsherim.type} value={hF.type} onChange={v=>setHF(p=>({...p,type:v}))} options={t.hechsherim.types}/><Inp label={t.hechsherim.contact} value={hF.contact} onChange={v=>setHF(p=>({...p,contact:v}))}/><Inp label={t.hechsherim.phone} value={hF.phone} onChange={v=>setHF(p=>({...p,phone:v}))}/><Inp label={t.hechsherim.email} value={hF.email} onChange={v=>setHF(p=>({...p,email:v}))} type="email"/><div style={{display:"flex",gap:7,marginTop:4}}><Btn onClick={saveH}>{t.hechsherim.save}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.hechsherim.cancel}</Btn></div></Mdl>)}

      {modal==="rb"&&(<Mdl title={t.rabbanuts.add} onClose={()=>setModal(null)}><Inp label={t.rabbanuts.name} value={rbF.name} onChange={v=>setRbF(p=>({...p,name:v}))}/><Inp label={t.rabbanuts.city} value={rbF.city} onChange={v=>setRbF(p=>({...p,city:v}))} options={["Jerusalem","Haifa","Tel Aviv","Beer Sheva","Bnei Brak","Tzfat"]}/><Inp label={t.rabbanuts.contact} value={rbF.contact} onChange={v=>setRbF(p=>({...p,contact:v}))}/><Inp label={t.rabbanuts.phone} value={rbF.phone} onChange={v=>setRbF(p=>({...p,phone:v}))}/><Inp label={t.rabbanuts.email} value={rbF.email} onChange={v=>setRbF(p=>({...p,email:v}))} type="email"/><div style={{display:"flex",gap:7,marginTop:4}}><Btn onClick={saveRb}>{t.rabbanuts.save}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.rabbanuts.cancel}</Btn></div></Mdl>)}

      {modal==="cM"&&(<Mdl title={t.mashgichim.remove} onClose={()=>setModal(null)} width={340}><p style={{color:"#bbb",fontSize:13,marginBottom:16}}>{t.mashgichim.confirmRemove}</p><div style={{display:"flex",gap:7}}><Btn variant="danger" onClick={()=>delM(confirmId)}>{t.mashgichim.remove}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.mashgichim.cancel}</Btn></div></Mdl>)}
      {modal==="cH"&&(<Mdl title={t.hechsherim.remove} onClose={()=>setModal(null)} width={340}><p style={{color:"#bbb",fontSize:13,marginBottom:16}}>{t.hechsherim.confirmRemove}</p><div style={{display:"flex",gap:7}}><Btn variant="danger" onClick={()=>delH(confirmId)}>{t.hechsherim.remove}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.hechsherim.cancel}</Btn></div></Mdl>)}
      {modal==="cRb"&&(<Mdl title={t.rabbanuts.remove} onClose={()=>setModal(null)} width={340}><p style={{color:"#bbb",fontSize:13,marginBottom:16}}>{t.rabbanuts.confirmRemove}</p><div style={{display:"flex",gap:7}}><Btn variant="danger" onClick={()=>delRb(confirmId)}>{t.rabbanuts.remove}</Btn><Btn variant="secondary" onClick={()=>setModal(null)}>{t.rabbanuts.cancel}</Btn></div></Mdl>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KashrutCRM />);
</script>
</body>
</html>
