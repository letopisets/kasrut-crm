gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css application/json application/javascript
                text/javascript application/x-javascript image/svg+xml;

upstream kasrut_api {
  server api:3000;
}

# Docker embedded DNS — re-resolve upstreams every 30 s so a container
# rebuild (which changes its IP) is picked up without restarting nginx.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen      80 default_server;
  server_name mykoshermap.com api.mykoshermap.com crm.mykoshermap.com;

  return 301 https://$host$request_uri;
}

# ── Map (public-facing) ───────────────────────────────────────────────────────
server {
  listen      443 ssl default_server;
  http2       on;
  server_name mykoshermap.com;

  ssl_certificate     /etc/letsencrypt/live/mykoshermap.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mykoshermap.com/privkey.pem;

  add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options     "nosniff"                                       always;
  add_header X-Frame-Options            "SAMEORIGIN"                                    always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
  add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()"      always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mykoshermap.com; frame-ancestors 'self';"
    always;

  location /api/ {
    proxy_pass            http://kasrut_api;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        $connection_upgrade;
    proxy_read_timeout    30s;
    client_max_body_size  1m;
  }

  location = /health {
    proxy_pass       http://kasrut_api/health;
    proxy_set_header Host $host;
    access_log       off;
  }

  location / {
    set $up_map        kasrut-map;
    proxy_pass         http://$up_map;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ── CRM (admin panel) ─────────────────────────────────────────────────────────
server {
  listen      443 ssl;
  http2       on;
  server_name crm.mykoshermap.com;

  ssl_certificate     /etc/letsencrypt/live/mykoshermap.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mykoshermap.com/privkey.pem;

  add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options     "nosniff"                                       always;
  add_header X-Frame-Options            "DENY"                                          always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
  add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()"      always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mykoshermap.com; frame-ancestors 'none';"
    always;

  location /api/ {
    proxy_pass            http://kasrut_api;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        $connection_upgrade;
    proxy_read_timeout    30s;
    client_max_body_size  1m;
  }

  location = /health {
    proxy_pass       http://kasrut_api/health;
    proxy_set_header Host $host;
    access_log       off;
  }

  location / {
    set $up_crm        kasrut-crm;
    proxy_pass         http://$up_crm;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ── API (direct access) ───────────────────────────────────────────────────────
server {
  listen      443 ssl;
  http2       on;
  server_name api.mykoshermap.com;

  ssl_certificate     /etc/letsencrypt/live/mykoshermap.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mykoshermap.com/privkey.pem;

  add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options     "nosniff"                                       always;
  add_header X-Frame-Options            "DENY"                                          always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
  add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()"      always;
  add_header Content-Security-Policy    "default-src 'none';"                           always;

  location = /health {
    proxy_pass       http://kasrut_api/health;
    proxy_set_header Host $host;
    access_log       off;
  }

  location / {
    proxy_pass            http://kasrut_api;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        $connection_upgrade;
    proxy_read_timeout    30s;
    client_max_body_size  1m;
  }
}
