gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css application/json application/javascript
                text/javascript application/x-javascript image/svg+xml;

upstream kasrut_api {
  server api:3000;
}

upstream kasrut_map {
  server kasrut-map:80;
}

upstream kasrut_crm {
  server kasrut-crm:80;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ── Map (default) ─────────────────────────────────────────────────────────────
server {
  listen      80 default_server;
  server_name localhost map.localhost;

  add_header X-Content-Type-Options "nosniff"     always;
  add_header X-Frame-Options        "SAMEORIGIN"  always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass            http://kasrut_api;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        $connection_upgrade;
    proxy_read_timeout    30s;
    client_max_body_size  1m;
  }

  location = /health {
    proxy_pass       http://kasrut_api/health;
    proxy_set_header Host $host;
    access_log       off;
  }

  location / {
    proxy_pass         http://kasrut_map;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ── CRM ───────────────────────────────────────────────────────────────────────
server {
  listen      80;
  server_name crm.localhost;

  add_header X-Content-Type-Options "nosniff"     always;
  add_header X-Frame-Options        "DENY"        always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass            http://kasrut_api;
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      Upgrade           $http_upgrade;
    proxy_set_header      Connection        $connection_upgrade;
    proxy_read_timeout    30s;
    client_max_body_size  1m;
  }

  location = /health {
    proxy_pass       http://kasrut_api/health;
    proxy_set_header Host $host;
    access_log       off;
  }

  location / {
    proxy_pass         http://kasrut_crm;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
