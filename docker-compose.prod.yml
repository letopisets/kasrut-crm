services:
  api:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set production CORS_ORIGINS}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DB: ${SEED_DB:-false}

  kasrut-map:
    build:
      args:
        VITE_API_URL: /api
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:?Set production VITE_APPLE_REDIRECT_URI}

  kasrut-crm:
    build:
      args:
        VITE_API_URL: /api

  nginx:
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
