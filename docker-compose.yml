services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kashrutcrm_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Раскомментировать для прямого доступа с хоста при локальной разработке:
    # ports:
    #   - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kashrutcrm_db}"]
      interval: 10s
      timeout:  5s
      retries:  10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The password reaches redis-server through this environment, never through
    # the file. It is also embedded in the api's REDIS_URL, so it must be
    # URL-safe: generate it with `openssl rand -hex 32`.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}
    # sh expands $$REDIS_PASSWORD inside the container; going back through
    # docker-entrypoint.sh keeps the image's switch from root to the redis user.
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # ports:
    #   - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Healthy only when an anonymous PING is refused (NOAUTH) and the password
      # gets PONG: a redis-server started without --requirepass stays unhealthy
      # and holds back the api. redis-cli exits 0 on error replies, hence grep.
      # REDISCLI_AUTH keeps the password out of the process arguments (-a would
      # show it in ps on the host).
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -q NOAUTH && REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout:  5s
      retries:  10

  api:
    build:
      context:    .
      dockerfile: kasrut-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      PORT:            3000
      API_PUBLIC_URL:  ${API_PUBLIC_URL:-http://localhost:8080/api}
      DATABASE_URL:    "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kashrutcrm_db}?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=10"
      REDIS_URL:       "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379"
      # :? — упадёт при старте если не задан
      JWT_SECRET:      ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex chars for AES-256)}
      # Sessions (docs/deployment/hetzner.md#sessions-and-refresh-cookies). Empty
      # means the API default: 15m access tokens, 30-day refresh sign-ins, Secure
      # cookies outside development/test. JWT_EXPIRES_IN is no longer read and is
      # deliberately not passed.
      ACCESS_TOKEN_TTL:       ${ACCESS_TOKEN_TTL:-}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-}
      COOKIE_SECURE:          ${COOKIE_SECURE:-}
      # Mandatory 2FA for CRM owners; REQUIRE_OWNER_2FA=false in the env file is
      # the rollback (hetzner.md#mandatory-2fa-for-crm-owners).
      REQUIRE_OWNER_2FA:      ${REQUIRE_OWNER_2FA:-true}
      # Mail server for map password resets, map email verification and CRM
      # expiry notices. Without SMTP_HOST no mail can be delivered and map email
      # verification defaults to off (hetzner.md#map-email-verification). Empty
      # SMTP_PORT = 587.
      SMTP_HOST:              ${SMTP_HOST:-}
      SMTP_PORT:              ${SMTP_PORT:-}
      SMTP_USER:              ${SMTP_USER:-}
      SMTP_PASS:              ${SMTP_PASS:-}
      MAP_EMAIL_VERIFICATION: ${MAP_EMAIL_VERIFICATION:-}
      MAP_PUBLIC_URL:         ${MAP_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID:  ${APPLE_CLIENT_ID:-}
      # Optional: LocationIQ geocoding (address→coords) — primary geocoder when set,
      # else Nominatim. Get a key at locationiq.com.
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY:-}
      LOCATIONIQ_ENDPOINT: ${LOCATIONIQ_ENDPOINT:-}
      # Optional: GovMap (Survey of Israel) — server-side geocoder tried first for
      # Israeli addresses. The token is bound to the mykoshermap.com domain; the API
      # sends GOVMAP_ORIGIN (default https://mykoshermap.com). Empty → LocationIQ/Nominatim only.
      GOVMAP_API_KEY: ${GOVMAP_API_KEY:-}
      GOVMAP_ORIGIN:  ${GOVMAP_ORIGIN:-}
      CORS_ORIGINS:    ${CORS_ORIGINS:-http://localhost,http://map.localhost,http://crm.localhost}
      RUN_MIGRATIONS:  ${RUN_MIGRATIONS:-true}
      SEED_DB:         ${SEED_DB:-false}
      # Required only when SEED_DB=true. Passwords must be strong and unique.
      SEED_OWNER_PASSWORD:       ${SEED_OWNER_PASSWORD:-}
      SEED_SECOND_OWNER_PASSWORD: ${SEED_SECOND_OWNER_PASSWORD:-}
      SEED_RABBANUT_PASSWORD:    ${SEED_RABBANUT_PASSWORD:-}
      SEED_MASHGIACH_PASSWORD:   ${SEED_MASHGIACH_PASSWORD:-}
      ALLOW_PRODUCTION_SEED:     ${ALLOW_PRODUCTION_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout:  5s
      retries:  10

  kasrut-map:
    build:
      context:    .
      dockerfile: kasrut-map/Dockerfile
      args:
        VITE_API_URL:            /api
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-http://localhost:8080/}
        VITE_SENTRY_DSN:         ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  kasrut-crm:
    build:
      context:    .
      dockerfile: kasrut-crm/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      kasrut-map:
        condition: service_started
      kasrut-crm:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
