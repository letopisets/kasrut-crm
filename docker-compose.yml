services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kashrutcrm_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Раскомментировать для прямого доступа с хоста при локальной разработке:
    # ports:
    #   - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kashrutcrm_db}"]
      interval: 10s
      timeout:  5s
      retries:  10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports:
    #   - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  10

  api:
    build:
      context:    .
      dockerfile: kasrut-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      PORT:            3000
      API_PUBLIC_URL:  ${API_PUBLIC_URL:-http://localhost:8080/api}
      DATABASE_URL:    "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kashrutcrm_db}?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=10"
      REDIS_URL:       redis://redis:6379
      # :? — упадёт при старте если не задан
      JWT_SECRET:      ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_EXPIRES_IN:  ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY:  ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (64 hex chars for AES-256)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID:  ${APPLE_CLIENT_ID:-}
      CORS_ORIGINS:    ${CORS_ORIGINS:-http://localhost,http://map.localhost,http://crm.localhost}
      RUN_MIGRATIONS:  ${RUN_MIGRATIONS:-true}
      SEED_DB:         ${SEED_DB:-false}
      # Required only when SEED_DB=true; the seed validates strength before deleting data.
      SEED_PASSWORD:   ${SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout:  5s
      retries:  10

  kasrut-map:
    build:
      context:    .
      dockerfile: kasrut-map/Dockerfile
      args:
        VITE_API_URL:            /api
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-http://localhost:8080/}
        VITE_SENTRY_DSN:         ${VITE_SENTRY_DSN:-}
        VITE_GOVMAP_TOKEN:       ${VITE_GOVMAP_TOKEN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  kasrut-crm:
    build:
      context:    .
      dockerfile: kasrut-crm/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      kasrut-map:
        condition: service_started
      kasrut-crm:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
