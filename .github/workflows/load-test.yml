name: Load test (nightly)

on:
  schedule:
    # 02:00 UTC every day — low-traffic window for production
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Target API URL (defaults to production)'
        required: false

jobs:
  k6:
    name: k6 smoke test
    runs-on: ubuntu-latest
    # Skip nightly runs if no production URL is configured
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_API_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run load test
        env:
          API_URL: ${{ inputs.api_url || vars.PRODUCTION_API_URL }}
        run: k6 run k6/smoke.js
