name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev-back-front]
  pull_request:
    branches: [master, main, dev-back-front]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (kasrut-api)
    runs-on: ubuntu-latest
    # A test that leaves a connection open makes jest hang instead of fail.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kasrut-api
    # Throwaway servers for the opt-in suites that need the real driver
    # (*.postgres.test.ts, *.redis.test.ts): mocked suites cannot see what
    # Postgres or Redis actually return. They listen on non-default host ports
    # on purpose: the app's own clients default to localhost:5432/6379, and a
    # live server there lets mocked suites open real connections (the Redis
    # client then keeps jest from exiting; pg crashes it after teardown).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: kasrut_ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kasrut_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
      - name: Build API
        run: npm run build
      - name: Build seed scripts
        run: npx tsc -p tsconfig.seed.json
      # Fresh random secrets per run: no working key is ever committed, and
      # config/env.ts rejects placeholder or patterned values at startup.
      - name: Generate throwaway secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Apply migrations and check drift (throwaway Postgres)
        env:
          DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5433/kasrut_ci
        run: |
          npx prisma migrate deploy
          # Exit 2 if the migrated database differs from schema.prisma.
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Tests
        run: npx jest --ci --runInBand
        env:
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5433/kasrut_ci
          REDIS_TEST_URL: redis://localhost:6380

  crm:
    name: CRM (kasrut-crm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-crm/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check + build
        run: npm run build
      - name: Tests
        run: npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism

  map:
    name: Map (kasrut-map)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-map/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism

  docker:
    name: Docker compose/images
    runs-on: ubuntu-latest
    needs: [backend, crm, map]
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          # JWT_SECRET / ENCRYPTION_KEY come from the throwaway-secrets step.
          REDIS_PASSWORD: ci-redis-password
          CORS_ORIGINS: https://mykoshermap.com,https://crm.mykoshermap.com,https://api.mykoshermap.com
          VITE_APPLE_REDIRECT_URI: https://mykoshermap.com/
        run: |
          # Valid config whose redis requires a password and whose api carries it
          # in REDIS_URL, and compose refuses to run without one.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > "$RUNNER_TEMP/compose.yml"
          grep -q -- '--requirepass' "$RUNNER_TEMP/compose.yml"
          grep -q 'REDIS_URL: redis://:ci-redis-password@redis:6379$' "$RUNNER_TEMP/compose.yml"
          if REDIS_PASSWORD= docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null 2>&1; then
            echo "::error::docker compose accepted an empty REDIS_PASSWORD"
            exit 1
          fi

      - name: Build API image
        run: docker build -f kasrut-api/Dockerfile .

      - name: Build map image
        run: >
          docker build
          -f kasrut-map/Dockerfile
          --build-arg VITE_API_URL=/api
          --build-arg VITE_APPLE_REDIRECT_URI=https://mykoshermap.com/
          .

      - name: Build CRM image
        run: >
          docker build
          -f kasrut-crm/Dockerfile
          --build-arg VITE_API_URL=/api
          .
