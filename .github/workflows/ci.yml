name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev-back-front]
  pull_request:
    branches: [master, main, dev-back-front]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (kasrut-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
      - name: Build API
        run: npm run build
      - name: Build seed scripts
        run: npx tsc -p tsconfig.seed.json
      - name: Tests
        run: npx jest --ci --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-must-be-at-least-32-chars-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost:5173

  crm:
    name: CRM (kasrut-crm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-crm/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check + build
        run: npm run build
      - name: Tests
        run: npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism

  map:
    name: Map (kasrut-map)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kasrut-map/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: npx vitest run --pool=forks --maxWorkers=1 --no-file-parallelism

  docker:
    name: Docker compose/images
    runs-on: ubuntu-latest
    needs: [backend, crm, map]
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGINS: https://mykoshermap.com,https://crm.mykoshermap.com,https://api.mykoshermap.com
          VITE_APPLE_REDIRECT_URI: https://mykoshermap.com/
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null

      - name: Build API image
        run: docker build -f kasrut-api/Dockerfile .

      - name: Build map image
        run: >
          docker build
          -f kasrut-map/Dockerfile
          --build-arg VITE_API_URL=/api
          --build-arg VITE_APPLE_REDIRECT_URI=https://mykoshermap.com/
          .

      - name: Build CRM image
        run: >
          docker build
          -f kasrut-crm/Dockerfile
          --build-arg VITE_API_URL=/api
          .
