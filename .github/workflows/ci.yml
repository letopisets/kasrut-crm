name: CI

on:
  push:
    branches: [master, main, dev-back-front]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (kasrut-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kasrut-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-must-be-at-least-32-chars-long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost:5173

  crm:
    name: CRM (kasrut-crm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kasrut-crm/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check + build
        run: npm run build
      - name: Tests
        run: npm test

  map:
    name: Map (kasrut-map)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasrut-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kasrut-map/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
